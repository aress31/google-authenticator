plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'googleauthenticator'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.miglayout:miglayout-swing:11.5.2'
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    enforceCheck = false
    java {
        googleJavaFormat('2.0.0').aosp().cleanup(false).formatJavadoc(false).reorderImports(true)
    }
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats Java sources with Google Java Format.'
    dependsOn 'spotlessApply'
}

tasks.named('shadowJar') {
    archiveFileName = 'google-authenticator-all.jar'
    mergeServiceFiles()
    // Let service descriptors reach the transformer while excluding other duplicates.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}
