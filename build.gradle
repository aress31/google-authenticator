plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'googleauthenticator'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('shadowJar') {
    archiveFileName = 'google-authenticator-all.jar'
    mergeServiceFiles()
    // Let service descriptors reach the transformer while excluding other duplicates.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}
